<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diplomas | Clarisa Rojas Fotografia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><div class="brand">Clarisa Rojas Fotografia</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="clients.html">Clientes</a><a href="jobs.html">Trabajos</a><a href="packages.html">Paquetes</a><a class="active" href="diplomas.html">Diplomas</a><a href="follow-ups.html">Seguimiento escuelas</a><button data-logout type="button">Cerrar sesión</button></nav></aside>
    <main class="main">
      <section class="container">
        <div class="page-header"><h1 class="page-title">Catálogo de diplomas</h1><button id="newDiplomaBtn" class="btn btn-primary">Subir diploma</button></div>
        <section class="card">
          <div id="diplomaTemplates"></div>
        </section>
      </section>
    </main>
  </div>
  <div id="diplomaModal" class="modal hidden"><div class="modal-content"><div class="page-header"><h2>Subir diploma</h2><button class="btn" data-close-modal>Cerrar</button></div><form id="diplomaForm">
    <div class="form-group"><label>Nombre del diseño</label><input class="input" name="name" required placeholder="Diploma clásico dorado"></div>
    <div class="form-group"><label>Nivel escolar</label><select class="select" name="school_level" required><option value="KINDER">Preescolar / Kinder</option><option value="PRIMARY">Primaria</option><option value="SECONDARY">Secundaria</option></select></div>
    <div class="form-group"><label>Imagen preview del diploma</label><input class="input" name="file" type="file" accept="image/*,application/pdf" required></div>
    <button class="btn btn-primary" type="submit">Subir al catálogo</button>
  </form></div></div>
  <script type="module" src="js/diplomas.js"></script>
</body>
</html>
