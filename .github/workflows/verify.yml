name: Verify static application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:ui
