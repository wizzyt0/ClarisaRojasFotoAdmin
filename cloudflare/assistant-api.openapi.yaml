openapi: 3.1.0
info:
  title: Clarisa Rojas Fotografia - API privada del asistente
  version: 1.2.0
  description: >-
    API privada. GET usa el token de lectura; las escrituras limitadas usan el token separado.
    Fechas de evento/entrega, paquetes/precios, aprobaciones, pagos existentes, usuarios y borrados quedan bloqueados.
servers:
  - url: https://clarisa-assistant-api.mudjkdriver.workers.dev
    description: Worker desplegado. Requiere Authorization Bearer.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getApiHealth
      summary: Verificar la API con autenticacion
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/schools:
    get:
      operationId: listSchools
      summary: Buscar escuelas
      parameters:
        - name: q
          in: query
          description: Busca por nombre de escuela; no admite comodines ni expresiones.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de escuelas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolsPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createSchool
      summary: Dar de alta una escuela y sus contactos
      description: No acepta precios, paquetes ni enlaces de aprobación.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolCreate' }
      responses:
        '200': { description: Escuela creada, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Ya existe una escuela con ese nombre }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/schools/{schoolId}:
    patch:
      operationId: updateRoutineSchoolFields
      summary: Actualizar datos rutinarios permitidos de una escuela
      description: >-
        Requiere el token independiente de escritura. No admite cantidades de paquetes, fechas de evento/entrega,
        campos financieros, estados de impresión ni campos adicionales.
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolPatch' }
      responses:
        '200': { description: Escuela actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/clients/{clientId}:
    patch:
      operationId: updateRoutineClientFields
      summary: Actualizar datos rutinarios permitidos de un cliente
      description: Requiere el token independiente de escritura. Solo acepta name, phone, secondary_phone, email y notes.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPatch' }
      responses:
        '200': { description: Cliente actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/jobs:
    get:
      operationId: listJobs
      summary: Consultar trabajos
      parameters:
        - name: client_id
          in: query
          description: UUID del cliente/escuela.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, pattern: '^[A-Z_]{2,40}$' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de trabajos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobsPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createJob
      summary: Crear trabajo sin paquete ni precio
      description: Crea trabajo en estado inicial, sin fechas de evento/entrega, paquete ni precio definido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '200': { description: Trabajo creado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Consultar un trabajo
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Trabajo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobObject' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateRoutineJobFields
      summary: Actualizar titulo o notas de un trabajo
      description: Requiere el token independiente de escritura. Fechas, cantidades, precio y estado quedan bloqueados.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPatch' }
      responses:
        '200': { description: Trabajo actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/jobs/{jobId}/groups:
    get:
      operationId: listJobGroups
      summary: Consultar grupos, cantidades y paquete elegido
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de grupos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupsPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createGroup
      summary: Agregar grupo, maestra y cantidad
      description: No acepta paquete, formato de impresion, precio ni cantidad de paquetes.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRoutine' }
      responses:
        '200': { description: Grupo creado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/groups/{groupId}:
    patch:
      operationId: updateGroupRoutine
      summary: Actualizar nombre, maestra, telefono, cantidad o notas
      description: Solo campos rutinarios; no modifica paquetes, precios, estados ni fechas.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRoutinePatch' }
      responses:
        '200': { description: Grupo actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/jobs/{jobId}/pieces:
    get:
      operationId: listJobPieces
      summary: Consultar estado de diplomas, carpetas y piezas
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de piezas; no incluye tokens de aprobacion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PiecesPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/jobs/{jobId}/finance:
    get:
      operationId: getJobFinance
      summary: Consultar total, abonos, saldo y gastos de un trabajo
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Resumen financiero calculado en cada consulta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceObject' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/jobs/{jobId}/deposits:
    get:
      operationId: listJobDeposits
      summary: Consultar abonos y fechas de un trabajo
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de abonos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositsPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: recordDeposit
      summary: Registrar un abono nuevo
      description: Solo agrega abonos. No hay operaciones para editar o eliminar uno existente.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositCreate' }
      responses:
        '200': { description: Abono agregado, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedRecord' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/finance/costs:
    get:
      operationId: listCosts
      summary: Consultar costos y recetas de materiales
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de costos activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostsPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/finance/expenses:
    get:
      operationId: listExpenses
      summary: Consultar gastos registrados
      parameters:
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Fecha inicial, inclusiva.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Fecha final, inclusiva.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de gastos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensesPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/catalogs/packages:
    get:
      operationId: listPackages
      summary: Consultar paquetes y metadatos de sus imagenes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de paquetes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackagesPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/catalogs/diplomas:
    get:
      operationId: listDiplomas
      summary: Consultar disenos de diploma
      parameters:
        - $ref: '#/components/parameters/SchoolLevel'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de disenos de diploma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiplomasPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/catalogs/folders:
    get:
      operationId: listFolders
      summary: Consultar disenos de carpeta
      parameters:
        - $ref: '#/components/parameters/SchoolLevel'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de disenos de carpeta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoldersPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/previews/{previewId}:
    get:
      operationId: getPreviewImage
      summary: Obtener una imagen de catalogo o preview de maestra
      description: >-
        Requiere Bearer. Solo devuelve JPEG, PNG o WebP de hasta 15 MiB.
        Para archivos de trabajo solo permite TEACHER_PREVIEW, nunca PRINT_HIGH_RES.
        La respuesta es binaria y no genera una URL publica permanente.
      parameters:
        - name: previewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Imagen binaria
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/ImageTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque API token
  parameters:
    Limit:
      name: limit
      in: query
      description: Registros por pagina. Predeterminado 50; minimo 1; maximo 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Offset:
      name: offset
      in: query
      description: Desplazamiento desde 0; maximo 100000.
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SchoolId:
      name: schoolId
      in: path
      required: true
      description: UUID de school_profiles.id, el campo id de cada objeto escuela.
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      description: UUID de clients.id, disponible como client_id en cada objeto escuela.
      schema: { type: string, format: uuid }
    SchoolLevel:
      name: school_level
      in: query
      description: Filtro opcional por nivel.
      schema: { type: string, enum: [KINDER, PRIMARY, SECONDARY] }
  responses:
    InvalidRequest:
      description: Parametro invalido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token faltante o invalido
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: Metodo no permitido para esta ruta
      headers:
        Allow:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Credencial sin permiso de escritura o permiso de base de datos denegado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ImageTooLarge:
      description: Imagen mayor de 15 MiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMedia:
      description: El archivo no es JPEG, PNG o WebP
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Error interno sin detalles del backend
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: API no configurada o backend no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    Health:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
        version: { type: string }
      required: [ok, version]
    UpdatedRecord:
      type: object
      additionalProperties: false
      properties:
        data: { type: object, additionalProperties: true }
      required: [data]
    ClientPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        secondary_phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], maxLength: 254 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    SchoolPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        school_name: { type: string, minLength: 1, maxLength: 200 }
        contact_name: { type: [string, 'null'], maxLength: 200 }
        contact_phone: { type: [string, 'null'], maxLength: 40 }
        contact_email: { type: [string, 'null'], maxLength: 254 }
        teacher_name: { type: [string, 'null'], maxLength: 200 }
        teacher_phone: { type: [string, 'null'], maxLength: 40 }
        principal_name: { type: [string, 'null'], maxLength: 200 }
        principal_phone: { type: [string, 'null'], maxLength: 40 }
        grade_or_class: { type: [string, 'null'], maxLength: 120 }
        last_contact_date: { type: [string, 'null'], format: date }
        next_follow_up_date: { type: [string, 'null'], format: date }
        follow_up_status: { type: [string, 'null'], enum: [NEW_CONTACT, CONTACT_NEXT_YEAR, INTERESTED, QUOTE_SENT, CONFIRMED, NOT_INTERESTED, RECURRING_CLIENT, null] }
        commercial_notes: { type: [string, 'null'], maxLength: 5000 }
        student_count: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
    SchoolCreate:
      type: object
      additionalProperties: false
      required: [school_name, contact_phone]
      properties:
        school_name: { type: string, minLength: 1, maxLength: 200 }
        school_level: { type: [string, 'null'], enum: [KINDER, PRIMARY, SECONDARY, null] }
        contact_name: { type: [string, 'null'], maxLength: 200 }
        contact_phone: { type: string, minLength: 1, maxLength: 40 }
